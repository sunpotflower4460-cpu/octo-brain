name = "octo-brain"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# enable_request_signal: クライアント切断(停止ボタン・アプリ終了)で request.signal を発火させ、
# 以降のモデル呼び出し(=原価)とロックを即座に止める。無いと切断後も最後まで課金が続く。
compatibility_flags = ["enable_request_signal"]

# 法務文書(legal/*.md)を文字列モジュールとして取り込み、/legal/* で公開する
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# 環境変数 (シークレットではない設定)
# ENVIRONMENT の既定は production(安全側)。ローカル開発では .dev.vars の
# ENVIRONMENT=development が上書きし、/api/dev/* が有効になる。
[vars]
ENVIRONMENT = "production"
# 本番オリジン。CORS許可に使う。本番デプロイ時は wrangler secret ではなく
# ここ or デプロイ環境の vars で上書きする
ALLOWED_ORIGIN = ""

# P5 堅牢化: クォータ・連打防止・全体タイムアウト予算(文字列。未設定なら既定値)
# FREE_MONTHLY_QUOTA: 無料枠の月間上限(超過で 429 quota_exceeded)
FREE_MONTHLY_QUOTA = "100"
# FREE_DAILY_QUOTA: 1人の1日上限(単位)。共有の1日予算を少数の利用者が使い切らないため
FREE_DAILY_QUOTA = "20"
# MIN_INTERVAL_MS: 同一clientIdの最小リクエスト間隔(未満は 429 too_frequent)
MIN_INTERVAL_MS = "1500"
# REQUEST_BUDGET_MS: リクエスト全体の実時間上限(超過でモデル呼び出しを中断し 504 timeout)
REQUEST_BUDGET_MS = "30000"
# IP_DAILY_QUOTA: 同一IPの1日あたり上限(クォータ単位)。clientId 使い捨て濫用の原価の天井。
# 携帯回線の CGNAT で複数人が同一IPになり得るため個人の月間枠より大きく取る
IP_DAILY_QUOTA = "300"
# DEEP_PLAN_ENABLED: deep プランの提供可否。原価が厳しいときに "false" で止める運用スイッチ
DEEP_PLAN_ENABLED = "true"
# DAILY_BUDGET_USD: 全体の1日原価の上限(課金なし運用の天井)。70% を超えると軽いモード
# (ディープもライトで回答・統合脳の推論なし)に自動で切り替え、100% で当日の受付を停止
DAILY_BUDGET_USD = "3"
# MODEL_PROFILE: "deepseek" | "luna"。未指定なら OPENAI_API_KEY の有無で自動(あれば luna)
# MODEL_FALLBACK: 主のプロバイダーが混雑(429)・障害(5xx)のとき、もう一方へ自動で切り替える。
#   両方のキーがあれば有効。止めるときは "off"
# MODEL_PROFILE = "luna"
# LUNA_SYNTH_REASONING: luna 構成で統合脳だけ推論をオン("none" | "low" | "medium" | "high")。
# 質は上がり得るが推論トークン分の原価と待ち時間が増える(docs/pricing_notes.md)
# 2026-09-30 比較実験(6問×4構成)で low を採用: 原価は推論なしとほぼ同じ(約0.16円/回)、
# 待ち時間 +約2秒、書き出しの引用・独自判断・問いで終わる、の遵守が安定
LUNA_SYNTH_REASONING = "low"
# WORLDS: 腕ごとに「違う世界」(登山ガイド・救急医…)に立たせて探求し、世界をまたぐ本質を掴む
# (docs/01_depth_design.md §5.5)。"on" 以外なら従来どおり。
# 2026-10-01 盲検評価(18問)で単体チャットを初めて上回ったため既定でオン
WORLDS = "on"

# IP 単位のバースト制限(Cloudflare Rate Limiting)。60秒あたり limit 回まで。
# namespace_id はアカウント内で一意な任意の整数文字列。
[[unsafe.bindings]]
name = "IP_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# KVネームスペース(クォータ・連打防止・原価ログ)。作成コマンド:
#   wrangler kv namespace create OCTO_KV / --preview
# ID はシークレットではない(アカウント外からは使えない)。
[[kv_namespaces]]
binding = "OCTO_KV"
id = "f95b85e5e9e64283b6b481e58d1de353"
preview_id = "2ac980d1873a41d7b39d5d295a311fe3"

# シークレット (APIキー) はリポジトリに書かない。以下で設定する:
#   本番: wrangler secret put DEEPSEEK_API_KEY   (等、.dev.vars.example のキー名を参照)
#   開発: workers/.dev.vars に記載 (.gitignore 済み)
